<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#16357E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Internet Online" />
    <title>Internet Online</title>

    <!-- Open Graph / vista previa de enlace (WhatsApp, redes) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Internet Online" />
    <meta property="og:title" content="Internet Online — El internet de nuestra gente" />
    <meta property="og:description" content="Actualiza tus datos y paga tu servicio de internet fácil y seguro." />
    <meta property="og:image" content="https://app.internetonline.co/og-image.jpg" />
    <meta property="og:url" content="https://app.internetonline.co" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Internet Online — El internet de nuestra gente" />
    <meta name="twitter:description" content="Actualiza tus datos y paga tu servicio de internet fácil y seguro." />
    <meta name="twitter:image" content="https://app.internetonline.co/og-image.jpg" />
    %sveltekit.head%
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredPrompt = e;
      });
    </script>
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
