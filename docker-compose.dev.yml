version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: isp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isp_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - isp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: isp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - isp-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: isp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/isp_manager"
      REDIS_URL: "redis://:redis123@redis:6379"
      JWT_SECRET: "change_this_secret_min_32_chars_in_production_2024"
      JWT_EXPIRES_IN: "8h"
      FRONTEND_URL: "http://localhost:3000"
      # SMTP Configuration
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "your-email@gmail.com"
      SMTP_PASS: "your-app-password"
      # Company Information
      COMPANY_NAME: "Mi ISP"
      COMPANY_NIT: "123456789-0"
      COMPANY_CITY: "Cali"
      COMPANY_ADDRESS: "Cra 123 #45-67"
      COMPANY_PHONE: "+57 2 555 1234"
      COMPANY_EMAIL: "contacto@miisp.com"
      # Wompi Configuration
      WOMPI_API_URL: "https://api.wompi.co/v1"
      WOMPI_PUBLIC_KEY: "pub_test_..."
      WOMPI_PRIVATE_KEY: "prv_test_..."
      WOMPI_EVENTS_KEY: "events_test_..."
      # Mikrotik Configuration
      MIKROTIK_HOST: "192.168.1.1"
      MIKROTIK_PORT: 8728
      MIKROTIK_USERNAME: "admin"
      MIKROTIK_PASSWORD: "mikrotik123"
      # Notification Services
      TWILIO_ACCOUNT_SID: "AC..."
      TWILIO_AUTH_TOKEN: "..."
      TWILIO_PHONE: "+1234567890"
      WHATSAPP_PHONE: "+573001234567"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - isp-network
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    command: npm run dev

  # PgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: isp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@isp-manager.com"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isp-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  isp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
